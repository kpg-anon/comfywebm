name: release

# scripts/release.ps1 builds Windows (installer + portable zip) on the
# maintainer's PC, publishes the GitHub release with them and a latest.json
# for Windows, and that publishing starts this workflow, which adds the
# platforms a Windows PC cannot build:
#   prep    finds the release, and which platforms it still lacks
#   build   macOS (Apple silicon and Intel) and Linux (AppImage, deb, rpm),
#           uploaded into the release (Windows too if the release has no installer)
#   latest  rewrites latest.json from the signatures on the release, with
#           every platform, so installed copies on every system get the update
#
# Started by hand (Actions > release > Run workflow):
#   with a tag:    the same for that tag's existing release (to redo a failed run)
#   without a tag: builds every platform as workflow artifacts, no release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build into (empty: build only, no release)"
        required: false
        default: ""

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      release_id: ${{ steps.p.outputs.release_id }}
      version: ${{ steps.p.outputs.version }}
      include: ${{ steps.p.outputs.include }}
    steps:
      - id: p
        shell: python
        env:
          EVENT: ${{ github.event_name }}
          REL_TAG: ${{ github.event.release.tag_name }}
          REL_ID: ${{ github.event.release.id }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          import json, os, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["REL_TAG"] if os.environ["EVENT"] == "release" else os.environ.get("IN_TAG", "").strip()
          rid, have = "", set()
          if tag:
              rel = json.loads(subprocess.run(["gh", "api", f"repos/{repo}/releases/tags/{tag}"], check=True, capture_output=True, text=True).stdout)
              rid = str(rel["id"])
              have = {a["name"] for a in rel["assets"]}
          print("tag:", tag or "(none: build only)", "release:", rid, "assets:", sorted(have))
          mac = [
              {"os": "macos-latest", "args": "--target aarch64-apple-darwin", "rust_target": "aarch64-apple-darwin"},
              {"os": "macos-latest", "args": "--target x86_64-apple-darwin", "rust_target": "x86_64-apple-darwin"},
          ]
          # 22.04: the AppImage then runs on systems with glibc 2.35 or newer
          include = [{"os": "ubuntu-22.04", "args": "", "rust_target": ""}] + mac
          # Windows is built on the maintainer's PC; CI builds it when the release has no installer, or with no release
          if not tag or not any(n.endswith("-setup.exe") for n in have):
              include.insert(0, {"os": "windows-latest", "args": "", "rust_target": ""})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"tag={tag}\nrelease_id={rid}\nversion={tag.lstrip('v')}\ninclude={json.dumps(include)}\n")

  build:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prep.outputs.include) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust_target }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # the release to upload into; empty (build only): nothing is uploaded
          releaseId: ${{ needs.prep.outputs.release_id }}
          # latest.json is written once by the latest job, so parallel builds cannot overwrite each other's entry
          includeUpdaterJson: false
          args: ${{ matrix.args }}
      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $dir = 'target/release/portable'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/comfywebm.exe $dir
          # an MSVC build links the WebView2 loader in; a GNU build needs the DLL beside the exe
          if (Test-Path target/release/WebView2Loader.dll) { Copy-Item target/release/WebView2Loader.dll $dir }
          Set-Content -Encoding ascii "$dir/portable" @(
            'This file makes comfywebm portable: while it is here, settings, presets, the queue,'
            'the cache and the remembered options are kept in the "data" folder beside it.'
          )
          New-Item -ItemType Directory -Force target/release/bundle/portable | Out-Null
          $zip = "target/release/bundle/portable/comfywebm_${v}_x64-portable.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip -Force
          $rid = '${{ needs.prep.outputs.release_id }}'
          if ($rid) {
            $name = Split-Path $zip -Leaf
            gh api --method POST -H 'Content-Type: application/zip' `
              "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$rid/assets?name=$name" `
              --input $zip --jq .name
          }
      - name: Keep the bundles (build only)
        if: needs.prep.outputs.release_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}-${{ matrix.rust_target }}
          path: |
            target/release/bundle/
            target/*/release/bundle/
          if-no-files-found: error

  latest:
    if: needs.prep.outputs.release_id != ''
    needs: [prep, build]
    runs-on: ubuntu-latest
    steps:
      - name: latest.json from the signatures on the release
        shell: python
        env:
          RELEASE_ID: ${{ needs.prep.outputs.release_id }}
          TAG: ${{ needs.prep.outputs.tag }}
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          import json, os, subprocess, sys, datetime
          repo, rid, tag, version = os.environ["GITHUB_REPOSITORY"], os.environ["RELEASE_ID"], os.environ["TAG"], os.environ["VERSION"]
          def gh(*a):
              return subprocess.run(["gh", "api", *a], check=True, capture_output=True, text=True).stdout
          rel = json.loads(gh(f"repos/{repo}/releases/{rid}"))
          assets = json.loads(gh(f"repos/{repo}/releases/{rid}/assets", "--paginate"))
          names = {a["name"]: a for a in assets}
          print("assets:", ", ".join(sorted(names)))
          # the update file of each platform: the one with a .sig beside it
          def pick(test):
              hits = [n for n in names if test(n) and n + ".sig" in names]
              return hits[0] if len(hits) == 1 else sys.exit(f"expected one update file, got {hits}")
          files = {
              "windows-x86_64": pick(lambda n: n.endswith("-setup.exe")),
              "linux-x86_64": pick(lambda n: n.endswith(".AppImage")),
              "darwin-aarch64": pick(lambda n: n.endswith(".app.tar.gz") and "aarch64" in n),
              "darwin-x86_64": pick(lambda n: n.endswith(".app.tar.gz") and ("x64" in n or "x86_64" in n)),
          }
          platforms = {}
          for plat, name in files.items():
              sig = gh("-H", "Accept: application/octet-stream", f"repos/{repo}/releases/assets/{names[name + '.sig']['id']}")
              platforms[plat] = {"signature": sig.strip(), "url": f"https://github.com/{repo}/releases/download/{tag}/{name}"}
          latest = {
              "version": version,
              "notes": (rel.get("body") or f"comfywebm {tag}").strip(),
              "pub_date": rel.get("published_at") or datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          json.dump(latest, open("latest.json", "w", encoding="utf-8"), indent=2)
          for p, v in platforms.items():
              print(p, v["url"])
          if "latest.json" in names:
              gh("--method", "DELETE", f"repos/{repo}/releases/assets/{names['latest.json']['id']}")
          gh("--method", "POST", "-H", "Content-Type: application/json",
             f"https://uploads.github.com/repos/{repo}/releases/{rid}/assets?name=latest.json", "--input", "latest.json")
