[package]
name = "comfywebm-engine"
version = "1.0.6"
description = "ffmpeg planning, encoding and probing for comfywebm"
authors = ["kpg-anon"]
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# config.toml and the preset files, which people edit by hand
toml = "0.8"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
